<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天气智农 · 企业端交互原型</title><style>

display:flex;gap:10px;justify-content:space-between;align-items:center}.demo select{background:#fff8e9;border:1px solid #d9cda9;padding:4px;border-radius:5px;font-size:12px}.content{padding:30px 34px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:23px}.head h1{font-size:28px;letter-spacing:-.5px;margin:0 0 4px}.head p{margin:0;color:var(--muted)}.kicker{font-size:10px;letter-spacing:2px;color:var(--green);font-weight:700}.row{display:flex;align-items:center;gap:12px}.split{display:grid;grid-template-columns:1.55fr 1fr;gap:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.card h2{font-size:17px;margin:0 0 16px}.card h3{margin:0 0 7px;font-size:16px}.stat label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:30px;line-height:1.5}.stat small{font-size:11px;color:var(--muted)}.hero{background:var(--forest);color:#edf6e9;border-radius:16px;padding:26px 30px;display:flex;gap:24px;justify-content:space-between;align-items:center}.hero h2{font-size:24px;margin:7px 0}.hero p{margin:0;color:#bdd7c4;max-width:580px}.hero .kicker{color:#d5edb6}.hero button{background:var(--lime);color:var(--forest);margin-top:18px}.hero .weathericon{font-size:72px;color:#d5edb6;padding-right:18px}.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:#eaf3e8;color:var(--green)}.badge.amber{background:#fff0d4;color:var(--amber)}.badge.red{background:#fbe7e3;color:var(--red)}.muted{color:var(--muted)}.tiny{font-size:12px}.divider{border-top:1px solid var(--line);margin:16px 0}.listitem{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.listitem:last-child{border-bottom:0}.listitem p{margin:4px 0}.field-map{height:215px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:20px;background:#ecf0df;border-radius:12px;margin-bottom:14px;transform:rotate(-1deg)}.plot{border:1px dashed #5f8d53;background:#d2e5be;display:grid;place-items:center;border-radius:6px;font-size:12px}.plot:first-child{grid-row:span 2;background:#e6d7a1;border:2px solid #b48031}.plot:nth-child(2){background:#b5d8bc}.plot:nth-child(4){background:#cadce5}.progress{height:6px;border-radius:5px;background:#e8eee5;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#76a36b}label{display:block;font-weight:600;font-size:12px;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #cbd9cf;border-radius:8px;padding:10px;background:white;color:var(--ink)}textarea{resize:vertical;min-height:90px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.form-error{color:var(--red);font-size:12px;min-height:18px;margin-top:12px}.hint{background:#f1f5ee;padding:12px 14px;border-radius:8px;font-size:12px;margin:12px 0}.hint.warn{background:#fff3de;color:#825619}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500;background:#f7f9f4}th,td{padding:13px 10px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button.active{background:var(--forest);color:white}.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.chat{min-height:480px;display:flex;flex-direction:column}.messages{display:grid;gap:18px;padding-bottom:25px;max-height:580px;overflow:auto}.bubble{background:#f1f5ee;border-radius:12px;padding:16px 18px;max-width:96%}.bubble.user{justify-self:end;background:var(--forest);color:white;max-width:80%}.bubble h3{font-size:15px;margin:0 0 9px}.bubble p{margin:7px 0}.bubble li{margin:5px 0}.chat form{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:10px}.chat form input{min-width:0}.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.quick button{font-size:12px;padding:7px 10px;background:white;border:1px solid var(--line)}.source{border-left:3px solid #adc991;padding:8px 12px;background:white;font-size:12px;margin:8px 0}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;font-size:20px;color:var(--ink);margin-bottom:10px}.chart{height:145px;display:flex;align-items:end;gap:16px;margin:18px 0 10px;padding-bottom:22px}.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;position:relative}.chart .col i{display:block;background:#adc99a;border-radius:6px 6px 0 0;min-height:2px}.chart .col span{position:absolute;bottom:-25px;font-size:10px;left:50%;transform:translateX(-50%)}.chart .col b{font-size:11px;text-align:center;font-weight:500;padding:3px}.alert-banner{background:#fff1da;border:1px solid #efd3a3;border-radius:10px;padding:16px;margin-bottom:20px}.alert-banner h3{margin:0 0 5px}.taskcard .status{float:right}.taskcard p{margin:9px 0}.taskcard .row{margin-top:18px;flex-wrap:wrap}.tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.toast{position:fixed;bottom:25px;right:25px;background:var(--forest);color:white;padding:12px 22px;border-radius:10px;z-index:10;max-width:85vw;box-shadow:0 8px 30px #0002}.toast[hidden]{display:none}dialog{border:1px solid var(--line);border-radius:16px;padding:28px;max-width:550px;width:calc(100% - 32px);color:var(--ink)}dialog::backdrop{background:#14392f70}dialog h2{margin:0 0 12px;font-size:21px}dialog .actions{display:flex;gap:10px;justify-content:end;margin-top:20px}.login{max-width:420px;margin:35px auto}.login h1{font-size:26px}.footer{margin-top:22px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:10px}.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}.steps span{background:#eef4e8;padding:6px 9px;border-radius:5px}.settings{max-width:800px}
@media(max-width:1050px){.shell{grid-template-columns:190px 1fr}.side{padding:24px 12px}.stats{grid-template-columns:repeat(2,1fr)}.split,.chat-layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.content{padding:24px}.top,.demo{padding-left:24px;padding-right:24px}}@media(max-width:650px){.shell{display:block}.side{position:static;height:auto;padding:14px}.brand{margin:0 4px 14px}.brand strong{font-size:19px}.side nav{display:flex;overflow:auto;gap:4px}.side nav button{white-space:nowrap;padding:8px 10px;font-size:12px}.side nav .glyph,.side .bottom{display:none}.top{padding:13px 16px}.top small{font-size:10px}.top .tools button{font-size:11px;padding:8px}.demo{padding:8px 16px;align-items:start}.demo select{max-width:130px}.content{padding:20px 16px}.head{align-items:start}.head h1{font-size:24px}.head p{font-size:12px}.grid,.tasks,.form-grid{grid-template-columns:1fr}.hero{padding:22px}.hero h2{font-size:21px}.hero .weathericon{display:none}.stats{gap:10px}.card{padding:18px}.chat form{flex-wrap:wrap}.chat form input{flex-basis:100%}.chat form button{width:100%}.footer{flex-direction:column}.stat strong{font-size:25px}}
 .chat form button{flex:none;white-space:nowrap;min-width:88px}.plot{padding:8px}@media(max-width:650px){.head{flex-direction:column;align-items:stretch}.head>button{align-self:flex-end}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><span class="logo">✳</span><div><strong>天气智农</strong><small>AGRI WEATHER</small></div></div><nav id="nav" aria-label="主导航"></nav><div class="bottom">让天气信息走进农事决策<br>企业端 · V1.1 交互演示<a href="index.html">查看交付文档 ↗</a><a href="interaction-spec.html">交互规格 ↗</a></div></aside><div class="main"><header class="top"><div><div class="farm">青禾示范农场 <span class="badge">演示农场</span></div><small>四川 · 雅安　 /　北京时间 UTC+8</small></div><div class="tools"><button class="outline" data-page="notifications">通知 <span id="unread">2</span></button><button class="outline" data-page="settings">农场管理者</button></div></header><div class="demo"><span>交互演示 · 所有气象、地块与助手回答均为示例，未接入实时服务。</span><label style="margin:0;font-weight:400">状态演示 <select id="scenario" aria-label="状态演示"><option value="normal">正常场景</option><option value="missing">缺少生育期</option><option value="stale">天气已过期</option><option value="timeout">服务超时</option><option value="empty">暂无数据</option></select></label></div><main class="content" id="view"></main></div></div><dialog id="modal"></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navItems=[['overview','◫','农场概览'],['fields','▧','地块与作物'],['alerts','△','风险预警'],['weather','☁','气象详情'],['assistant','✳','农事助手'],['tasks','✓','农事任务'],['monitor','＋','监测填报'],['notifications','◉','通知中心'],['settings','⚙','农场设置']];
const fields=[{id:'A',name:'A区玉米田',crop:'玉米',stage:'灌浆期',area:24,risk:'强降雨风险',health:88},{id:'B',name:'B区小麦田',crop:'小麦',stage:'抽穗期',area:18,risk:'暂无新风险',health:92},{id:'C',name:'C区水稻田',crop:'水稻',stage:'分蘖期',area:32,risk:'低温待关注',health:90}];
const risks=[{id:'rain',title:'强降雨风险提示',level:'需优先处理',field:'A',text:'示例预报：未来24小时降水50–80 mm。需核查地块排水情况。',type:'农业风险提示'},{id:'cold',title:'低温风险提示',level:'需要关注',field:'C',text:'示例预报：夜间最低温度5 ℃。请结合品种与生育期复核。',type:'农业风险提示'}];
let state={page:'overview',field:'A',scenario:'normal',alertFilter:'all',notificationFilter:'all',taskFilter:'all',busy:false,messages:[],observations:[],tasks:[{id:'T001',field:'A',title:'巡检A区排水沟',owner:'现场人员',due:'2026-10-13T18:00',status:'待处理',feedback:'',evidence:'示例预警AL-01'}],notifications:[{id:1,title:'A区强降雨风险提示',text:'未来24小时需关注排水情况，点击查看依据。',type:'预警',read:false},{id:2,title:'排水沟巡检待处理',text:'请确认负责人和现场排水情况。',type:'任务',read:false},{id:3,title:'监测数据示例',text:'当前界面采用示例数据，请勿当作实测值。',type:'系统',read:true}]};
const initialFields=JSON.parse(JSON.stringify(fields));
const initialState=JSON.parse(JSON.stringify(state));
const storageKey='tianqi-zhinong-prototype:v1.1';
function saveLocal(){try{localStorage.setItem(storageKey,JSON.stringify({tasks:state.tasks,observations:state.observations,notifications:state.notifications,stages:fields.map(f=>({id:f.id,stage:f.stage}))}));}catch{}}
function loadLocal(){try{const data=JSON.parse(localStorage.getItem(storageKey)||'null');if(!data)return;for(const k of ['tasks','observations','notifications'])if(Array.isArray(data[k]))state[k]=data[k];if(Array.isArray(data.stages))for(const f of fields){const saved=data.stages.find(s=>s.id===f.id);if(saved&&typeof saved.stage==='string')f.stage=saved.stage;}}catch{}}
loadLocal();
const field=()=>fields.find(f=>f.id===state.field);
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function head(kicker,title,subtitle,actions=''){return `<div class="head"><div><div class="kicker">${kicker}</div><h1>${title}</h1><p>${subtitle}</p></div>${actions}</div>`}
function fieldSelect(){return `<select id="fieldSelect" aria-label="选择地块" ${state.busy?'disabled':''}>${fields.map(f=>`<option value="${f.id}" ${f.id===state.field?'selected':''}>${f.name}</option>`).join('')}</select>`}
function statusHint(){if(state.scenario==='stale')return '<div class="alert-banner"><strong>天气数据已过期</strong><p>示例预报更新时间距场景时间超过6小时。更新前暂停据此生成农事结论。</p><button data-action="retry">更新天气</button></div>';if(state.scenario==='timeout')return '<div class="alert-banner"><strong>天气服务暂时不可用</strong><p>请求超时，暂无可核验的天气信息。已有任务仍可查看。</p><button data-action="retry">重试</button></div>';return ''}
function render(){saveLocal();const p=state.page;$('#nav').innerHTML=navItems.map(([id,g,n])=>`<button data-page="${id}" class="${p===id?'active':''}" ${p===id?'aria-current="page"':''}><span class="glyph">${g}</span>${n}</button>`).join('');$('#unread').textContent=state.notifications.filter(n=>!n.read).length;const renderers={overview,fields:fieldPage,alerts:alertPage,weather:weatherPage,assistant:assistantPage,tasks:taskPage,monitor:monitorPage,notifications:notificationPage,settings:settingsPage,login:loginPage};$('#view').innerHTML=(renderers[p]||overview)();bindForms();}
function go(page){if(state.busy){toast('请等待当前助手演示结束');return}state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})}
function overview(){return head('FARM OVERVIEW','把天气风险，变成下一步行动','场景日期：2026年10月13日 · 下列数据仅用于交互演示',`<button class="outline" data-page="monitor">＋ 登记监测</button>`)+statusHint()+`<section class="hero"><div><div class="kicker">TODAY’S PRIORITY</div><h2>先看A区的排水准备</h2><p>未来24小时强降雨示例场景。核查预报依据、现场情况和玉米生育期，再确认巡检任务。</p><button data-detail="rain">查看风险与行动 →</button></div><div class="weathericon" aria-hidden="true">☂</div></section><div class="stats"><div class="card stat"><label>管理地块</label><strong>3 <small>块</small></strong><small>共74亩 · 示例面积</small></div><div class="card stat"><label>待关注风险</label><strong>2 <small>项</small></strong><small>农业风险提示 · 非官方预警</small></div><div class="card stat"><label>未完成任务</label><strong>${state.tasks.filter(t=>['待处理','进行中'].includes(t.status)).length} <small>项</small></strong><small>以任务中心为准</small></div><div class="card stat"><label>监测记录</label><strong>${state.observations.length} <small>条</small></strong><small>本地演示记录</small></div></div><div class="split"><section class="card"><h2>农场地块示意</h2><div class="field-map" aria-label="示意图，不是实际地理边界"><button class="plot" data-field="A">A区 · 玉米<br>降雨待处理</button><button class="plot" data-field="B">B区 · 小麦</button><div class="plot">示例道路</div><button class="plot" data-field="C">C区 · 水稻</button><div class="plot">示例排水沟</div></div><span class="tiny muted">布局示意，非实际位置与遥感图像</span></section><section class="card"><h2>待办行动 <span class="badge">${state.tasks.filter(t=>t.status==='待处理').length}</span></h2>${state.tasks.filter(t=>t.status==='待处理').map(t=>`<div class="listitem"><div><strong>${esc(t.title)}</strong><p class="muted tiny">${esc(t.owner)} · ${esc(t.due.replace('T',' '))}</p></div><button data-page="tasks">处理</button></div>`).join('')||'<div class="empty">暂无待处理任务</div>'}<div class="divider"></div><h3>农事助手</h3><p class="muted">先核对依据，再确认行动。</p><button class="primary" data-page="assistant">问一问 →</button></section></div>`+footer('S01 · 概览');}
function footer(t){return `<div class="footer"><span>${t} · 交互原型V1.1</span><span>示例数据 · 无实时预报 / 无自动设备执行</span></div>`}
function fieldPage(){return head('FIELDS & CROPS','地块与作物','为建议提供明确的地点、作物和生育期。')+`<div class="grid">${fields.map(f=>`<article class="card"><span class="badge ${f.id==='A'?'amber':''}">${f.id==='A'?'需关注':'已建档'}</span><h2 style="margin-top:15px">${f.name}</h2><p class="muted">${f.crop} · ${f.area}亩</p><div class="divider"></div><div class="row" style="justify-content:space-between"><span>生育期</span><strong>${state.scenario==='missing'&&f.id==='A'?'待补充':esc(f.stage)}</strong></div><p class="tiny muted">健康率${f.health}% · 沿用原仓库模拟指标</p><div class="progress"><span style="width:${f.health}%"></span></div><p class="tiny">${f.risk}</p><button class="outline" data-edit-field="${f.id}">查看 / 编辑</button> <button class="primary" data-ask-field="${f.id}">询问农事</button></article>`).join('')}</div><div class="hint">面积与健康率为示例，不用于真实产量评估；Agent将使用经核验的作物与生育期信息。</div>`+footer('S02 · 地块');}
function alertPage(){const items=state.scenario==='empty'?[]:risks.filter(r=>state.alertFilter==='all'||r.field===state.alertFilter);return head('RISK CENTER','风险预警','查看来源、影响范围与有效期，再进入农事决策。')+statusHint()+`<div class="tabs">${[['all','全部地块'],['A','A区玉米'],['C','C区水稻']].map(([v,n])=>`<button data-alert-filter="${v}" class="${state.alertFilter===v?'active':''}">${n}</button>`).join('')}</div>${items.length?items.map(r=>`<section class="card" style="margin-bottom:15px"><div class="row" style="justify-content:space-between"><span class="badge amber">${r.level}</span><span class="tiny muted">${r.type}</span></div><h2 style="margin-top:13px">${r.title}</h2><p>${r.text}</p><p class="tiny muted">关联：${fields.find(f=>f.id===r.field).name} · 示例预报发布时间：2026-10-13 09:00</p><button class="primary" data-detail="${r.id}">查看详情与依据</button></section>`).join(''):'<div class="card empty"><strong>暂无风险提示</strong>当前条件下没有示例记录。<p>仍可查看天气与地块状态。</p><button data-page="weather">查看天气</button></div>'}`+footer('S03 · 预警');}
function weatherPage(){const unavailable=['timeout','stale','empty'].includes(state.scenario);return head('WEATHER DETAIL','气象详情','区分观测与预报，保留地点、时间和数据来源。',fieldSelect())+statusHint()+(unavailable?'<div class="card empty"><strong>暂无可用于决策的天气数据</strong><p>请更新天气，或补充现场监测记录。</p><button data-page="monitor">登记现场情况</button></div>':`<div class="stats"><div class="card stat"><label>示例当前温度</label><strong>22 <small>℃</small></strong><small>示例观测 · 2026-10-13 09:00</small></div><div class="card stat"><label>示例空气湿度</label><strong>78 <small>%</small></strong><small>示例观测 · 2026-10-13 09:00</small></div><div class="card stat"><label>未来24小时降水</label><strong>${state.field==='A'?'50–80':'10–20'} <small>mm</small></strong><small>示例预报 · 非实测值</small></div><div class="card stat"><label>示例平均风速</label><strong>3.2 <small>m/s</small></strong><small>示例观测 · 2026-10-13 09:00</small></div></div><section class="card"><h2>降水趋势示意 <span class="badge">示例预报</span></h2><div class="chart" aria-label="6个示例4小时区间降水值，单位mm">${(state.field==='A'?[4,8,18,24,10,6]:[1,2,3,4,3,2]).map((v,i)=>`<div class="col"><b>${v} mm</b><i style="height:${v*4}px"></i><span>${['09–13','13–17','17–21','21–01','01–05','05–09'][i]}</span></div>`).join('')}</div><p class="tiny muted">6个4小时区间共${state.field==='A'?70:15}mm，对应当前地块预报范围内的一个示例序列。</p><div class="divider"></div><div class="source">来源：预置天气快照（非真实气象提供方）<br>发布 / 拉取时间：2026-10-13 09:00 / 09:05<br>预报区间：2026-10-13 09:00 至 2026-10-14 09:00（UTC+8）<br>位置：雅安试点位置示例；空间粒度未核验</div><button class="primary" data-page="assistant">结合地块询问农事 →</button></section>`)+footer('S04 · 气象');}
function assistantPage(){return head('FARM ASSISTANT','先有依据，再给行动','针对选定地块，演示天气查询、信息澄清与任务确认。')+`<div class="chat-layout"><section class="card chat"><div class="messages" id="messages">${state.messages.length?state.messages.map(messageHTML).join(''):'<div class="bubble"><h3>今天想先处理哪块地？</h3><p>我会先核对地块、作物阶段和天气来源，再提供可供确认的建议。</p><p class="tiny muted">当前为场景演示，尚未连接模型服务。</p></div>'}</div><div class="quick"><button data-question="明天A区适合打药吗？">明天适合打药吗？</button><button data-question="A区强降雨前要做什么？">强降雨前做什么？</button><button data-question="请帮我检查地块信息">检查地块信息</button></div><form id="chatForm"><input id="chatInput" aria-label="输入农事问题" placeholder="例如：强降雨前要做什么？" maxlength="500" required ${state.busy?'disabled':''}><button class="primary" ${state.busy?'disabled':''}>${state.busy?'查询中…':'发送 →'}</button></form></section><aside><section class="card"><h2>当前地块</h2>${fieldSelect()}<p><strong>${field().crop}</strong> · ${state.scenario==='missing'?'生育期待补充':esc(field().stage)}</p><p class="tiny muted">面积：${field().area}亩 · 示例</p><div class="divider"></div><h3>证据状态</h3><span class="badge ${state.scenario==='normal'?'':'amber'}">${{normal:'示例数据可核对',missing:'需要补充',stale:'天气过期',timeout:'服务超时',empty:'暂无数据'}[state.scenario]}</span><p class="tiny muted">建议展示依据摘要与有效期，最终任务需你确认。</p></section><section class="card" style="margin-top:16px"><h2>操作边界</h2><p class="tiny muted">可以准备任务草稿。具体农药处方交由农技人员复核；不自动操作设备。</p><button class="outline" data-action="clearChat">清空对话</button></section></aside></div>`+footer('S05 · 助手');}
function messageHTML(m){return m.role==='user'?`<div class="bubble user">${esc(m.text)}</div>`:`<div class="bubble">${m.html}</div>`}
function sourceHTML(f){return `<div class="source"><strong>依据① 天气快照WX-DEMO-01</strong><br>${f.id==='A'?'未来24小时降水50–80 mm':'该地块使用演示天气快照，尚未核验当地真实预报'}；预报发布时间2026-10-13 09:00（UTC+8）。</div><div class="source"><strong>依据② 地块档案FIELD-${f.id}</strong><br>${esc(f.name)} · ${esc(f.crop)} · ${esc(f.stage)} · 来源：本原型示例档案。</div><p class="tiny muted">有效期：场景日期2026-10-13 15:00前需更新天气；演示行动不替代现场判断。</p>`}
function ask(q){if(state.busy)return;q=q.trim();if(!q)return;const mentioned=q.match(/([ABC])区/i);if(mentioned&&mentioned[1].toUpperCase()!==state.field){state.messages.push({role:'user',text:q},{role:'assistant',html:'<h3>请先确认地块</h3><p>问题中的地块与当前选择不一致。请在右侧切换地块后重新提问，避免混用天气与作物信息。</p>'});render();return;}if(state.scenario==='empty'){state.messages.push({role:'user',text:q},{role:'assistant',html:'<h3>暂无地块相关数据</h3><p>无法核验天气与现场情况。请先登记监测信息或更新数据，再继续询问。</p><button data-page="monitor">登记监测</button>'});render();return}state.messages.push({role:'user',text:q});state.busy=true;render();const selected=state.field;const scenario=state.scenario;setTimeout(()=>{const f=fields.find(x=>x.id===selected);let html;if(scenario==='missing'){html='<h3>先确认作物生育期</h3><p>缺少当前生育期，暂不能给出针对性农事建议。请在地块档案中补充；不确定时可请农技人员确认。</p><button data-edit-field="'+selected+'">补充生育期</button>';}else if(scenario==='stale'){html='<h3>当前预报已过期</h3><p>数据超过更新门槛，无法据此判断明天是否适合操作。更新天气后请重新提问。</p><button data-action="retry">更新天气</button>';}else if(scenario==='timeout'){html='<h3>天气查询超时</h3><p>没有获得有效气象依据，因此暂停天气相关结论。你可以重试，或记录现场情况。</p><button data-action="retry">重试服务</button>';}else if(/忽略|密钥|管理员|其他农场|泄露/.test(q)){html='<h3>请提供本农场的农事问题</h3><p>当前请求涉及权限或无关指令。演示不提供账户信息或其他农场的数据。</p>';}else if(/农药|用量|混配|打药|喷药/.test(q)){html='<h3>先核对操作条件</h3><p>降水、风速、药剂标签、作物阶段和目标病虫害都会影响喷施。当前仅有示例资料，不能判定真实作业窗口。</p><p>请让农技人员核对登记信息和现场条件；本MVP不输出具体农药品种、剂量或混配处方。</p>'+sourceHTML(f);}else if(/雨|排水|巡检/.test(q)&&f.id==='A'){html='<div class="steps"><span>地块已核对</span><span>示例天气已读取</span><span>行动待确认</span></div><h3 style="margin-top:14px">优先核查A区排水情况</h3><p>示例预报存在强降雨风险。建议先做现场巡检，再根据实际情况处理。</p><ol><li>检查排水沟是否堵塞，并记录积水位置。</li><li>对田间排水困难区域拍照、交给负责人确认。</li><li>天气更新或现场情况变化后，重新评估安排。</li></ol>'+sourceHTML(f)+'<button class="primary" data-action="draft">确认并准备巡检任务</button>';}else{html='<h3>请进一步明确要处理的问题</h3><p>当前地块是'+esc(f.name)+'。你想了解天气风险、排水巡检，还是需要补充监测信息？本演示只覆盖预设场景，无法自由推理。</p><button data-page="weather">查看气象依据</button>';}state.messages.push({role:'assistant',html});state.busy=false;render();$('#messages')?.scrollTo(0,$('#messages').scrollHeight);},700);}
function taskPage(){const tasks=state.tasks.filter(t=>state.taskFilter==='all'||t.status===state.taskFilter);return head('ACTION TRACKING','农事任务','从人工确认到执行反馈，每一步都能追溯。',`<button class="outline" data-action="export">导出本次演示记录</button>`)+`<div class="tabs">${['all','待处理','进行中','已完成','已取消'].map(s=>`<button data-task-filter="${s}" class="${state.taskFilter===s?'active':''}">${s==='all'?'全部任务':s}</button>`).join('')}</div><div class="tasks">${tasks.map(t=>`<article class="card taskcard"><span class="badge status">${t.status}</span><div class="kicker">${t.id}</div><h2 style="margin-top:9px">${esc(t.title)}</h2><p>${fields.find(f=>f.id===t.field)?.name||'地块未指定'}</p><p class="tiny muted">负责人：${esc(t.owner)}<br>截止时间：${esc(t.due.replace('T',' '))}<br>关联依据：${esc(t.evidence)}</p>${t.feedback?`<div class="hint">反馈：${esc(t.feedback)}</div>`:''}<div class="row">${t.status==='待处理'?`<button class="primary" data-start-task="${t.id}">开始执行</button>`:''}${t.status==='进行中'?`<button class="primary" data-complete-task="${t.id}">填写完成反馈</button>`:''}${['待处理','进行中'].includes(t.status)?`<button class="outline" data-cancel-task="${t.id}">取消任务</button>`:''}</div></article>`).join('')||'<div class="card empty"><strong>暂无匹配任务</strong><p>从预警详情或助手建议创建任务。</p><button data-page="alerts">查看预警</button></div>'}</div><div class="hint">演示记录保存在当前浏览器，刷新后保留。可导出JSON或在设置中重置。任务不会触发设备动作。</div>`+footer('S06 · 任务');}
function monitorPage(){return head('FIELD OBSERVATION','登记现场监测','补充真实系统所需的地点、因子、单位与观测时间。')+`<div class="split"><section class="card"><h2>新增监测记录</h2><form id="monitorForm"><div class="form-grid"><div><label for="station">监测站点 *</label><input id="station" name="station" required maxlength="60" placeholder="例如：A区1号站"></div><div><label for="obsField">关联地块 *</label><select id="obsField" name="field">${fields.map(f=>`<option value="${f.id}" ${f.id===state.field?'selected':''}>${f.name}</option>`).join('')}</select></div><div><label for="observed">观测时间 *</label><input id="observed" name="time" type="datetime-local" required value="2026-10-13T09:00"></div><div><label for="factor">监测因子 *</label><select id="factor" name="factor"><option value="temperature">温度</option><option value="humidity">空气湿度</option><option value="soil">土壤体积含水率</option><option value="rain">降水</option><option value="wind">风速</option></select></div><div><label for="obsValue">数值 *</label><input id="obsValue" name="value" type="number" step="any" required placeholder="填写观测值"></div><div><label for="unit">单位（随因子匹配）</label><input id="unit" name="unit" value="℃" readonly></div></div><div id="rainRange" hidden><label for="rainStart">降水统计开始 *</label><input id="rainStart" name="rainStart" type="datetime-local"><label for="rainEnd">降水统计结束 *</label><input id="rainEnd" name="rainEnd" type="datetime-local"></div><label for="obsNote">异常情况 / 观测方法</label><textarea id="obsNote" name="note" maxlength="500" placeholder="例如：田边局部积水；土壤测量方法"></textarea><div class="form-error" id="monitorError" role="alert"></div><button class="primary">保存记录</button></form></section><aside><section class="card"><h2>录入规则</h2><p class="tiny muted">温度：-60～60℃<br>湿度/土壤含水率：0～100%<br>降水/风速：≥0<br>降水须填写统计起止时间<br>观测时间不能晚于场景时间5分钟</p><div class="hint">场景时间固定为2026-10-13 12:00（UTC+8）。录入范围用于防错，不代表农作物安全阈值。</div></section><section class="card" style="margin-top:16px"><h2>本次已登记 <span class="badge">${state.observations.length}</span></h2>${state.observations.map(o=>`<div class="listitem"><div><strong>${esc(o.station)}</strong><p class="tiny muted">${esc(o.label)} ${o.value}${o.unit}<br>${esc(o.time.replace('T',' '))}</p></div></div>`).join('')||'<p class="muted tiny">暂无记录</p>'}</section></aside></div>`+footer('S07 · 监测');}
function notificationPage(){let ns=state.notifications.filter(n=>state.notificationFilter==='all'||n.type===state.notificationFilter);return head('NOTIFICATIONS','通知中心','预警与任务提醒集中查看。',`<button class="outline" data-action="readAll">全部标为已读</button>`)+`<div class="tabs">${['all','预警','任务','系统'].map(s=>`<button data-notification-filter="${s}" class="${state.notificationFilter===s?'active':''}">${s==='all'?'全部通知':s}</button>`).join('')}</div><section class="card"><label for="notificationSearch">查找通知</label><input id="notificationSearch" type="search" placeholder="输入通知标题或内容"><div id="notificationList">${ns.length?ns.map(n=>`<div class="listitem notification-item" data-search="${esc(n.title+' '+n.text)}"><div><span class="badge ${n.read?'':'amber'}">${n.read?'已读':'未读'}</span> <strong>${esc(n.title)}</strong><p class="muted tiny">${esc(n.text)}</p></div><button data-notification="${n.id}">查看</button></div>`).join(''):'<div class="empty"><strong>暂无通知</strong>可切换其他类型查看。</div>'}</div></section>`+footer('S08 · 通知');}
function settingsPage(){return head('FARM SETTINGS','农场设置','管理上下文与演示会话。')+`<div class="settings"><section class="card"><h2>青禾示范农场</h2><p>当前角色：农场管理者<br>区域：四川 · 雅安（示例）<br>时区：Asia/Shanghai · UTC+8</p><div class="divider"></div><h3>数据与服务状态</h3><p class="muted tiny">天气：预置示例快照<br>助手：固定脚本交互<br>任务：本地演示记录<br>模型、后端、设备控制：未连接</p><div class="row"><button class="outline" data-action="export">导出本次记录</button><button class="primary" data-page="login">查看登录演示</button><button class="outline" data-action="resetDemo">重置演示记录</button></div></section><section class="card" style="margin-top:16px"><h2>评审入口</h2><p><a href="PRD.html">PRD需求文档</a> · <a href="interaction-spec.html">交互与组件规格</a> · <a href="evaluation.html">Agent评测报告</a></p></section></div>`+footer('S09 · 设置');}
function loginPage(){return `<section class="card login"><div class="logo">✳</div><h1>欢迎来到天气智农</h1><p class="muted">企业端登录流程演示</p><form id="loginForm"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6"><div class="form-error" id="loginError" role="alert"></div><button class="primary" style="width:100%">登录演示农场</button></form><div class="hint">演示账号：admin<br>演示密码：password<br>这不是生产身份鉴权。</div></section>`+footer('S00 · 登录');}
function showDialog(html){$('#modal').innerHTML=html;$('#modal').showModal();bindForms()}
function closeDialog(){if($('#modal').open)$('#modal').close()}
function riskDetail(id){const r=risks.find(x=>x.id===id);if(!r)return;state.field=r.field;showDialog(`<h2>${r.title}</h2><span class="badge amber">${r.type} · ${r.level}</span><p>${r.text}</p><div class="source">来源：WX-DEMO-01 · 预置示例预报<br>发布时间：2026-10-13 09:00<br>预报有效区间至：2026-10-14 09:00<br>决策前更新时间门槛：2026-10-13 15:00<br>关联：${esc(field().name)} · ${esc(field().stage)}<br>农业规则：演示规则，无已核验的农技阈值</div><p class="tiny muted">提示等级为演示优先级，不是官方预警等级。</p><div class="actions"><button data-action="close">关闭</button><button class="primary" data-ask-risk="${id}">带着预警问助手</button></div>`)}
function draft(){if(state.scenario!=='normal'){toast('请先补充或更新依据');return}showDialog(`<h2>确认巡检任务</h2><div class="hint">关联：${field().name} · WX-DEMO-01<br>行动：检查排水沟与积水点；现场复核后处理。</div><form id="taskForm"><label for="taskTitle">任务名称 *</label><input id="taskTitle" name="title" value="巡检${field().name}排水沟" required maxlength="80"><label for="owner">负责人 *</label><select id="owner" name="owner"><option>现场人员</option><option>农技人员</option><option>农场管理者</option></select><label for="due">截止时间 *</label><input id="due" name="due" type="datetime-local" value="2026-10-13T18:00" required><div class="form-error" id="taskError" role="alert"></div><p class="tiny muted">人工确认后保存到当前浏览器；不会执行设备操作。</p><div class="actions"><button type="button" data-action="close">返回</button><button class="primary">确认创建</button></div></form>`)}
function feedback(id,cancel=false){const t=state.tasks.find(x=>x.id===id);if(!t)return;showDialog(`<h2>${cancel?'取消任务':'完成反馈'}</h2><p>${esc(t.title)}</p><form id="feedbackForm" data-id="${id}" data-cancel="${cancel}"><label for="feedback">${cancel?'取消原因':'执行结果'} *</label><textarea id="feedback" name="feedback" required minlength="4" maxlength="500" placeholder="${cancel?'请说明原因':'例如：排水沟已巡检，局部堵塞已记录，待负责人复核。'}"></textarea><div class="actions"><button type="button" data-action="close">返回</button><button class="primary">确认${cancel?'取消':'完成'}</button></div></form>`)}
function editField(id){const f=fields.find(x=>x.id===id);showDialog(`<h2>地块档案 · ${f.name}</h2><form id="fieldForm" data-id="${id}"><p class="muted">作物：${f.crop} · 面积：${f.area}亩（示例）</p><label for="stage">当前生育期 *</label><input id="stage" name="stage" value="${state.scenario==='missing'?'':esc(f.stage)}" required maxlength="30" placeholder="请填写已确认的生育期"><div class="hint">保存更新当前浏览器中的地块档案。</div><div class="actions"><button type="button" data-action="close">返回</button><button class="primary">保存档案</button></div></form>`)}
function bindForms(){const search=$('#notificationSearch');if(search)search.oninput=()=>{const q=search.value.trim().toLowerCase();let visible=0;document.querySelectorAll('.notification-item').forEach(item=>{const match=item.dataset.search.toLowerCase().includes(q);item.style.display=match?'flex':'none';if(match)visible++;});let noResults=$('#notificationEmpty');if(!noResults){noResults=document.createElement('div');noResults.id='notificationEmpty';noResults.className='empty';$('#notificationList').append(noResults);}noResults.textContent='没有匹配通知，请更换关键词。';noResults.hidden=visible>0;};const chat=$('#chatForm');if(chat)chat.onsubmit=e=>{e.preventDefault();ask($('#chatInput').value)};const login=$('#loginForm');if(login)login.onsubmit=e=>{e.preventDefault();const d=new FormData(login);if(d.get('username')==='admin'&&d.get('password')==='password'){toast('已进入演示农场');go('overview')}else $('#loginError').textContent='用户名或密码错误，请使用演示账号。'};const ff=$('#fieldForm');if(ff)ff.onsubmit=e=>{e.preventDefault();const value=new FormData(ff).get('stage').trim();if(!value)return;fields.find(f=>f.id===ff.dataset.id).stage=value;state.scenario='normal';$('#scenario').value='normal';closeDialog();render();toast('生育期已更新，可重新提问')};const tf=$('#taskForm');if(tf)tf.onsubmit=e=>{e.preventDefault();const d=new FormData(tf);if(!d.get('title').trim()){$('#taskError').textContent='请填写任务名称';return}if(d.get('due')<='2026-10-13T12:00'){$('#taskError').textContent='截止时间须晚于场景时间2026-10-13 12:00';return}tf.querySelector('button.primary').disabled=true;state.tasks.push({id:'T'+String(state.tasks.length+1).padStart(3,'0'),field:state.field,title:d.get('title').trim(),owner:d.get('owner'),due:d.get('due'),status:'待处理',feedback:'',evidence:'WX-DEMO-01 / 本次助手建议'});closeDialog();state.page='tasks';render();toast('巡检任务已创建')};const fb=$('#feedbackForm');if(fb)fb.onsubmit=e=>{e.preventDefault();const d=new FormData(fb),v=d.get('feedback').trim();if(v.length<4){fb.querySelector('textarea').setCustomValidity('请至少填写4个字符的有效反馈');fb.reportValidity();return}const t=state.tasks.find(t=>t.id===fb.dataset.id);t.status=fb.dataset.cancel==='true'?'已取消':'已完成';t.feedback=v;closeDialog();render();toast('任务状态已更新')};if(fb)fb.querySelector('textarea').oninput=e=>e.target.setCustomValidity('');const mf=$('#monitorForm');if(mf){$('#factor').onchange=()=>{const f=$('#factor').value;$('#unit').value={temperature:'℃',humidity:'%',soil:'%',rain:'mm',wind:'m/s'}[f];$('#rainRange').hidden=f!=='rain';$('#rainStart').required=f==='rain';$('#rainEnd').required=f==='rain'};mf.onsubmit=e=>{e.preventDefault();const d=new FormData(mf);const v=Number(d.get('value')),f=d.get('factor');let err='';if(!d.get('station').trim())err='请填写监测站点';else if(!Number.isFinite(v))err='请输入有效数值';else if(f==='temperature'&&(v< -60||v>60))err='温度须在-60～60℃之间';else if(['humidity','soil'].includes(f)&&(v<0||v>100))err='百分比须在0～100之间';else if(['rain','wind'].includes(f)&&v<0)err='数值不能小于0';else if(d.get('time')>'2026-10-13T12:05')err='观测时间不能晚于场景时间5分钟';else if(f==='rain'&&(!d.get('rainStart')||!d.get('rainEnd')||d.get('rainStart')>=d.get('rainEnd')||d.get('rainEnd')>d.get('time')))err='降水开始须早于结束，结束不能晚于观测时间';if(err){$('#monitorError').textContent=err;return}if(state.scenario==='timeout'){$('#monitorError').textContent='保存服务超时，输入已保留。切换为正常场景后可重试。';return}state.observations.push({id:'OBS'+(state.observations.length+1),station:d.get('station').trim(),field:d.get('field'),factor:f,label:{temperature:'温度',humidity:'空气湿度',soil:'土壤含水率',rain:'降水',wind:'风速'}[f],value:v,unit:d.get('unit'),time:d.get('time'),note:d.get('note'),rainStart:d.get('rainStart'),rainEnd:d.get('rainEnd')});render();toast('监测记录已保存到当前会话')};}const fs=$('#fieldSelect');if(fs)fs.onchange=e=>{state.field=e.target.value;state.messages=[];render()};}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){go(d.page);return}if(d.field){state.field=d.field;go('fields');return}if(d.editField){editField(d.editField);return}if(d.askField){state.field=d.askField;state.messages=[];go('assistant');return}if(d.detail){riskDetail(d.detail);return}if(d.askRisk){const r=risks.find(x=>x.id===d.askRisk);closeDialog();state.field=r.field;state.messages=[];go('assistant');ask(r.id==='rain'?'A区强降雨前要做什么？':'C区低温前要关注什么？');return}if(d.question){ask(d.question);return}if(d.alertFilter){state.alertFilter=d.alertFilter;render();return}if(d.taskFilter){state.taskFilter=d.taskFilter;render();return}if(d.notificationFilter){state.notificationFilter=d.notificationFilter;render();return}if(d.startTask){state.tasks.find(t=>t.id===d.startTask).status='进行中';render();toast('任务已开始');return}if(d.completeTask){feedback(d.completeTask);return}if(d.cancelTask){feedback(d.cancelTask,true);return}if(d.notification){const n=state.notifications.find(x=>x.id===Number(d.notification));n.read=true;render();if(n.type==='预警')riskDetail('rain');else if(n.type==='任务')go('tasks');else toast(n.text);return}switch(d.action){case'close':closeDialog();break;case'draft':draft();break;case'retry':if(state.busy)return;state.scenario='normal';$('#scenario').value='normal';render();toast('已切换到正常演示场景，请重新操作');break;case'clearChat':if(state.busy)return;state.messages=[];render();break;case'readAll':state.notifications.forEach(n=>n.read=true);render();toast('全部通知已读');break;case'resetDemo':showDialog('<h2>重置演示记录</h2><p>任务、监测记录和地块修改将恢复初始示例。请先导出需要保留的记录。</p><div class="actions"><button data-action="close">返回</button><button class="primary" data-action="confirmReset">确认重置</button></div>');break;case'confirmReset':state=JSON.parse(JSON.stringify(initialState));fields.splice(0,fields.length,...JSON.parse(JSON.stringify(initialFields)));try{localStorage.removeItem(storageKey)}catch{}closeDialog();$('#scenario').value='normal';render();toast('已恢复初始示例');break;case'export':{const blob=new Blob([JSON.stringify({project:'天气智农',mode:'prototype-demo',exported_at:new Date().toISOString(),tasks:state.tasks,observations:state.observations},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='天气智农-演示记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示记录');break}}});
$('#scenario').onchange=e=>{if(state.busy){e.target.value=state.scenario;toast('请等待当前演示结束');return}const currentForm=$('#monitorForm');const draftValues=currentForm?Object.fromEntries(new FormData(currentForm)):null;state.scenario=e.target.value;state.messages=[];render();if(draftValues){const restored=$('#monitorForm');for(const [name,value] of Object.entries(draftValues)){const input=restored.elements.namedItem(name);if(input)input.value=value;}$('#factor').dispatchEvent(new Event('change'));}};
render();
</script></body></html>
